<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="eye-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4" />

  <!-- Radiating Audio Accessibility Waves -->
  <g stroke="url(#eye-grad)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.6">
    <!-- Left Waves -->
    <path d="M 120 200 A 70 70 0 0 0 120 312" />
    <path d="M 85 160 A 120 120 0 0 0 85 352" opacity="0.35" />
    <!-- Right Waves -->
    <path d="M 392 200 A 70 70 0 0 1 392 312" />
    <path d="M 427 160 A 120 120 0 0 1 427 352" opacity="0.35" />
  </g>

  <!-- Central Vision Eye Arc -->
  <g filter="url(#glow)">
    <!-- Eye Outline -->
    <path d="M 140 256 C 180 180, 332 180, 372 256 C 332 332, 180 332, 140 256 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="18" 
          stroke-linejoin="round" />
    
    <!-- Pupil / Sound Iris -->
    <circle cx="256" cy="256" r="48" fill="url(#eye-grad)" stroke="#ffffff" stroke-width="8" />
    <circle cx="256" cy="256" r="22" fill="url(#accent-grad)" />
    
    <!-- Glint -->
    <circle cx="244" cy="244" r="8" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Sound Bars under the Eye -->
  <g fill="url(#accent-grad)" opacity="0.95">
    <rect x="206" y="360" width="12" height="32" rx="6" />
    <rect x="231" y="348" width="12" height="56" rx="6" />
    <rect x="256" y="340" width="12" height="72" rx="6" />
    <rect x="281" y="348" width="12" height="56" rx="6" />
    <rect x="306" y="360" width="12" height="32" rx="6" />
  </g>
</svg>
