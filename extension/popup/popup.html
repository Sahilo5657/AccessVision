<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AccessVision Assistant</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="popup-root" role="application" aria-label="AccessVision Assistant controls">
    <header>
      <h1>
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
        </svg>
        AccessVision
      </h1>
    </header>

    <main>
      <!-- Reading Actions -->
      <section aria-labelledby="reading-heading">
        <h2 id="reading-heading" class="section-title">📖 Reading</h2>
        <div class="button-grid">
          <button id="btn-read-full" class="action-btn primary-action" title="Read all page content aloud">
            <span aria-hidden="true">📖</span> Read Full Page
          </button>
          <button id="btn-read-selection" class="action-btn" title="Read selected text or from current position">
            <span aria-hidden="true">📝</span> Read Selection
          </button>
          <button id="btn-read-urdu" class="action-btn urdu-btn" title="Read page content in Urdu" lang="ur">
            <span aria-hidden="true">🇵🇰</span> اردو میں پڑھیں
          </button>
          <button id="btn-read-english" class="action-btn" title="Read page content in English">
            <span aria-hidden="true">🇬🇧</span> Read in English
          </button>
        </div>
      </section>

      <!-- Playback Controls -->
      <section aria-labelledby="playback-heading">
        <h2 id="playback-heading" class="section-title">🎵 Playback</h2>
        <div class="button-grid four-col">
          <button id="btn-pause" class="action-btn small-btn" title="Pause reading">
            <span aria-hidden="true">⏸️</span> Pause
          </button>
          <button id="btn-resume" class="action-btn small-btn" title="Resume reading">
            <span aria-hidden="true">▶️</span> Resume
          </button>
          <button id="btn-stop" class="action-btn small-btn" title="Stop reading">
            <span aria-hidden="true">⏹️</span> Stop
          </button>
          <button id="btn-voice" class="action-btn small-btn" aria-pressed="false" title="Toggle voice commands">
            <span aria-hidden="true">🎤</span> Voice
          </button>
        </div>
      </section>

      <!-- Voice Settings (Quick) -->
      <section aria-labelledby="voice-heading">
        <h2 id="voice-heading" class="section-title">🎙️ Voice & Speed</h2>

        <div class="voice-controls">
          <div class="control-row">
            <label for="popup-speech-rate">Speed</label>
            <input type="range" id="popup-speech-rate" min="0.5" max="2.0" step="0.1" value="1.0" />
            <span id="popup-rate-value" class="range-value">1.0x</span>
          </div>
          <div class="control-row">
            <label for="popup-speech-pitch">Pitch</label>
            <input type="range" id="popup-speech-pitch" min="0.5" max="1.5" step="0.1" value="1.0" />
            <span id="popup-pitch-value" class="range-value">1.0</span>
          </div>
          <div class="control-row">
            <label for="popup-speech-volume">Volume</label>
            <input type="range" id="popup-speech-volume" min="0.1" max="1.0" step="0.1" value="1.0" />
            <span id="popup-volume-value" class="range-value">100%</span>
          </div>

          <div class="control-row voice-select-row">
            <label for="popup-english-voice">English Voice</label>
            <select id="popup-english-voice">
              <option value="">Auto (Best Available)</option>
            </select>
          </div>

          <div class="control-row voice-select-row">
            <label for="popup-urdu-voice">Urdu Voice</label>
            <select id="popup-urdu-voice">
              <option value="">Auto (Best Available)</option>
            </select>
          </div>

          <button id="btn-preview-voice" class="action-btn preview-btn" title="Preview selected voice">
            🔊 Preview Voice
          </button>
        </div>
      </section>

      <!-- Quick Actions -->
      <section aria-labelledby="actions-heading">
        <h2 id="actions-heading" class="section-title">⚡ Quick Actions</h2>
        <div class="button-grid">
          <button id="btn-summary" class="action-btn" title="Generate page summary">
            <span aria-hidden="true">📄</span> Summarize
          </button>
          <button id="btn-contrast" class="action-btn" aria-pressed="false" title="Toggle high contrast mode">
            <span aria-hidden="true">🌓</span> Contrast
          </button>
          <button id="btn-reading" class="action-btn" aria-pressed="false" title="Toggle reading mode">
            <span aria-hidden="true">📚</span> Reading Mode
          </button>
        </div>
      </section>

      <!-- Navigation -->
      <section aria-labelledby="nav-heading">
        <h2 id="nav-heading" class="section-title">🧭 Page Navigation</h2>
        <div class="button-grid">
          <button id="btn-prev-heading" class="action-btn" title="Go to previous heading">
            <span aria-hidden="true">⬆️</span> Prev H
          </button>
          <button id="btn-next-heading" class="action-btn" title="Go to next heading">
            <span aria-hidden="true">⬇️</span> Next H
          </button>
          <button id="btn-headings" class="action-btn" title="List all headings">
            <span aria-hidden="true">📋</span> Headings
          </button>
          <button id="btn-landmarks" class="action-btn" title="List all landmarks">
            <span aria-hidden="true">🗺️</span> Landmarks
          </button>
        </div>
      </section>

      <!-- Page Info -->
      <section aria-labelledby="info-heading">
        <h2 id="info-heading" class="section-title">ℹ️ Page Info</h2>
        <div id="page-info" aria-live="polite">
          <p id="page-title" class="info-text">Loading...</p>
        </div>
      </section>
    </main>

    <footer>
      <a href="../options/options.html" target="_blank" id="options-link">
        ⚙️ Advanced Settings
        <span class="sr-only">(opens in new tab)</span>
      </a>
    </footer>

    <!-- Status announcements -->
    <div id="status" aria-live="assertive" aria-atomic="true" class="sr-only"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
